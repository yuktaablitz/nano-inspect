<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- factory boundary -->
  <rect x="20" y="20" width="790" height="600" rx="16" fill="#f0f9ff" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="40" y="50" font-size="16" font-weight="700" fill="#0e7490">FACTORY FLOOR · HP ZGX Nano (GB10, 128 GB unified memory) · works offline</text>

  <!-- camera -->
  <rect x="40" y="90" width="130" height="80" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="105" y="122" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Line camera</text>
  <text x="105" y="142" font-size="12" text-anchor="middle" fill="#64748b">or operator upload</text>
  <text x="105" y="158" font-size="12" text-anchor="middle" fill="#64748b">every part</text>

  <!-- tier 1 -->
  <rect x="210" y="80" width="250" height="110" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="225" y="106" font-size="13" font-weight="800" fill="#0e7490">TIER 1 · every part</text>
  <text x="225" y="128" font-size="14" font-weight="700" fill="#0f172a">Qwen2.5-VL-7B + LoRA (vLLM)</text>
  <text x="225" y="147" font-size="12" fill="#334155">fine-tuned on the Nano; P(defect) from</text>
  <text x="225" y="162" font-size="12" fill="#334155">token log-probs + defect type + location</text>
  <text x="225" y="180" font-size="12" font-weight="700" fill="#0e7490">cheap LLM · every part · batched by vLLM</text>

  <!-- accept -->
  <rect x="520" y="95" width="120" height="44" rx="22" fill="#dcfce7" stroke="#15803d"/>
  <text x="580" y="122" font-size="14" font-weight="800" text-anchor="middle" fill="#15803d">ACCEPT</text>
  <text x="490" y="88" font-size="11" fill="#475569">P(defect) &lt; threshold</text>

  <!-- tier 2 -->
  <rect x="210" y="250" width="250" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="225" y="276" font-size="13" font-weight="800" fill="#7c3aed">TIER 2 · uncertain + 5% audit</text>
  <text x="225" y="298" font-size="14" font-weight="700" fill="#0f172a">Qwen3.8-27B + LoRA (vLLM)</text>
  <text x="225" y="317" font-size="12" fill="#334155">DGX Spark-verified recipe; compares the</text>
  <text x="225" y="334" font-size="12" fill="#334155">part with a known-good reference image;</text>
  <text x="225" y="349" font-size="12" fill="#334155">explains the defect; operator chat</text>
  <text x="225" y="370" font-size="12" font-weight="700" fill="#7c3aed">expensive LLM · few parts</text>

  <!-- policy -->
  <rect x="500" y="250" width="280" height="130" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="515" y="276" font-size="13" font-weight="800" fill="#c2410c">ESCALATION POLICY (explicit)</text>
  <text x="515" y="298" font-size="12" fill="#334155">evidence bucket → P(defect) by Bayes</text>
  <text x="515" y="315" font-size="12" fill="#334155">with the line's defect rate</text>
  <text x="515" y="336" font-size="12" fill="#0f172a">escalate if min(P·$escape, (1−P)·$scrap)</text>
  <text x="515" y="352" font-size="12" fill="#0f172a">                 &gt; $human review</text>
  <text x="515" y="372" font-size="12" font-weight="700" fill="#c2410c">measured on held-out parts</text>

  <rect x="520" y="410" width="120" height="44" rx="22" fill="#dcfce7" stroke="#15803d"/>
  <text x="580" y="437" font-size="14" font-weight="800" text-anchor="middle" fill="#15803d">ACCEPT</text>
  <rect x="660" y="410" width="120" height="44" rx="22" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="720" y="437" font-size="14" font-weight="800" text-anchor="middle" fill="#b91c1c">REJECT</text>

  <!-- local store -->
  <rect x="40" y="470" width="420" height="130" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text x="55" y="496" font-size="13" font-weight="800" fill="#0f172a">LOCAL RECORD + STORE-AND-FORWARD OUTBOX</text>
  <text x="55" y="518" font-size="12" fill="#334155">every decision + evidence in SQLite on the Nano (audit trail)</text>
  <text x="55" y="536" font-size="12" fill="#334155">escalations queue locally when the network is down</text>
  <text x="55" y="554" font-size="12" fill="#334155">only a ~5 KB crop of the suspect region is sent, not the image</text>
  <text x="55" y="572" font-size="12" fill="#334155">human labels come back → training data for the next LoRA</text>
  <text x="55" y="590" font-size="12" font-weight="700" fill="#0e7490">operator web app: inspect · line · escalations · policy</text>

  <!-- cloud -->
  <rect x="850" y="20" width="330" height="600" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="870" y="50" font-size="16" font-weight="700" fill="#c2410c">CLOUD · only when it pays off</text>
  <rect x="875" y="250" width="280" height="150" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="890" y="276" font-size="13" font-weight="800" fill="#c2410c">TIER 3 · human review console</text>
  <text x="890" y="298" font-size="12" fill="#334155">QC expert sees the crop + both</text>
  <text x="890" y="314" font-size="12" fill="#334155">models' evidence, one keypress</text>
  <text x="890" y="336" font-size="12" fill="#334155">fleet defect library across sites</text>
  <text x="890" y="358" font-size="12" fill="#334155">no AI inference in the cloud</text>
  <text x="890" y="384" font-size="12" font-weight="700" fill="#c2410c">labels → back to each edge site</text>
  <rect x="875" y="440" width="280" height="80" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text x="890" y="466" font-size="13" font-weight="800" fill="#0f172a">Fleet view</text>
  <text x="890" y="486" font-size="12" fill="#334155">escalation rate, time-to-review,</text>
  <text x="890" y="502" font-size="12" fill="#334155">VLM-vs-human agreement per site</text>

  <!-- arrows -->
  <line x1="170" y1="130" x2="206" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="117" x2="516" y2="117" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="335" y1="190" x2="335" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="345" y="224" font-size="11" fill="#475569">not sure, or random audit</text>
  <line x1="460" y1="315" x2="496" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="380" x2="580" y2="406" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="380" x2="720" y2="406" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="335" y1="380" x2="335" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M780,300 C 820,300 830,320 871,320" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#ao)"/>
  <text x="788" y="292" font-size="11" font-weight="700" fill="#c2410c">escalate</text>
  <path d="M460,540 C 700,540 760,470 871,470" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="600" y="560" font-size="11" fill="#c2410c">crop + evidence (when online)</text>
  <path d="M875,395 C 700,600 560,600 462,585" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="640" y="610" font-size="11" fill="#15803d">human labels → next on-device fine-tune</text>
</svg>
